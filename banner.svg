<svg width="1280" height="380" viewBox="0 0 1280 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kousha Rezaei — Full-Stack Developer, AI Engineer, Security">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="55%" stop-color="#0d1426"/>
      <stop offset="100%" stop-color="#070a14"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="nameFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="380" fill="url(#bg)"/>

  <g stroke="#1e293b" stroke-width="1" opacity="0.35">
    <line x1="0" y1="63" x2="1280" y2="63"/>
    <line x1="0" y1="126" x2="1280" y2="126"/>
    <line x1="0" y1="190" x2="1280" y2="190"/>
    <line x1="0" y1="253" x2="1280" y2="253"/>
    <line x1="0" y1="316" x2="1280" y2="316"/>
    <line x1="160" y1="0" x2="160" y2="380"/>
    <line x1="320" y1="0" x2="320" y2="380"/>
    <line x1="480" y1="0" x2="480" y2="380"/>
    <line x1="640" y1="0" x2="640" y2="380"/>
    <line x1="800" y1="0" x2="800" y2="380"/>
    <line x1="960" y1="0" x2="960" y2="380"/>
    <line x1="1120" y1="0" x2="1120" y2="380"/>
  </g>

  <g fill="#22d3ee">
    <circle cx="160" cy="63" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="480" cy="190" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="960" cy="126" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="800" cy="316" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="253" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite"/></circle>
  </g>

  <rect x="0" y="0" width="1280" height="5" fill="url(#accent)">
    <animate attributeName="x" values="-1280;0" dur="1.2s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1" keyTimes="0;1"/>
  </rect>

  <text x="90" y="92" font-family="'JetBrains Mono','Fira Code',monospace" font-size="20" fill="#22d3ee">~/kousha $ <tspan fill="#64748b">whoami</tspan>
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.3s" fill="freeze"/>
  </text>

  <text x="88" y="178" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="78" font-weight="700" fill="url(#nameFill)" letter-spacing="-1" opacity="0">Kousha Rezaei
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.6s" fill="freeze"/>
    <animate attributeName="y" values="190;178" dur="0.8s" begin="0.6s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1" keyTimes="0;1"/>
  </text>

  <text x="92" y="224" font-family="'JetBrains Mono','Fira Code',monospace" font-size="23" font-weight="500" fill="#818cf8" opacity="0">Full-Stack Developer<tspan fill="#475569"> · </tspan><tspan fill="#22d3ee">AI Engineer</tspan><tspan fill="#475569"> · </tspan><tspan fill="#34d399">Security</tspan>
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="1s" fill="freeze"/>
  </text>

  <text x="92" y="262" font-family="'Segoe UI',Arial,sans-serif" font-size="18" fill="#94a3b8" opacity="0">Building secure, intelligent products — from frontend to infrastructure.
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="1.3s" fill="freeze"/>
  </text>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="1.6s" fill="freeze"/>
    <g font-family="'JetBrains Mono',monospace" font-size="14" font-weight="500">
      <rect x="92" y="296" width="86" height="34" rx="17" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
      <text x="135" y="318" fill="#a5b4fc" text-anchor="middle">Python</text>
      <rect x="188" y="296" width="92" height="34" rx="17" fill="#0c2a33" stroke="#22d3ee" stroke-width="1"/>
      <text x="234" y="318" fill="#67e8f9" text-anchor="middle">FastAPI</text>
      <rect x="290" y="296" width="92" height="34" rx="17" fill="#11271f" stroke="#34d399" stroke-width="1"/>
      <text x="336" y="318" fill="#6ee7b7" text-anchor="middle">Next.js</text>
      <rect x="392" y="296" width="84" height="34" rx="17" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
      <text x="434" y="318" fill="#a5b4fc" text-anchor="middle">Docker</text>
      <rect x="486" y="296" width="150" height="34" rx="17" fill="#0c2a33" stroke="#22d3ee" stroke-width="1"/>
      <text x="561" y="318" fill="#67e8f9" text-anchor="middle">AI / RLHF · SFT</text>
      <rect x="646" y="296" width="118" height="34" rx="17" fill="#11271f" stroke="#34d399" stroke-width="1"/>
      <text x="705" y="318" fill="#6ee7b7" text-anchor="middle">Bug Bounty</text>
    </g>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="1s" begin="0.9s" fill="freeze"/>
    <rect x="880" y="96" width="330" height="208" rx="10" fill="#0b1120" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="902" cy="118" r="5" fill="#ef4444"/>
    <circle cx="920" cy="118" r="5" fill="#f59e0b"/>
    <circle cx="938" cy="118" r="5" fill="#22c55e"/>
    <g font-family="'JetBrains Mono',monospace" font-size="15">
      <text x="900" y="156" fill="#c084fc">const <tspan fill="#e2e8f0">dev</tspan> <tspan fill="#64748b">=</tspan> {</text>
      <text x="918" y="182" fill="#7dd3fc">role<tspan fill="#64748b">:</tspan> <tspan fill="#86efac">"engineer"</tspan>,</text>
      <text x="918" y="208" fill="#7dd3fc">stack<tspan fill="#64748b">:</tspan> <tspan fill="#86efac">"full"</tspan>,</text>
      <text x="918" y="234" fill="#7dd3fc">ai<tspan fill="#64748b">:</tspan> <tspan fill="#fbbf24">true</tspan>,</text>
      <text x="918" y="260" fill="#7dd3fc">secure<tspan fill="#64748b">:</tspan> <tspan fill="#fbbf24">true</tspan></text>
      <text x="900" y="286" fill="#e2e8f0">}<tspan fill="#22d3ee">;</tspan></text>
    </g>
    <rect x="975" y="248" width="10" height="18" fill="#22d3ee">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
